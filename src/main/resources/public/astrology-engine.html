<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Discovery Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #astro-engine {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #fff;
            text-align: center;
            padding: 40px 20px;
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a, #1a0a2e);
        }

        /* CONTAINER */
        .engine-container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: 600;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #a0a0c0;
            margin-bottom: 40px;
        }

        /* BOX */
        .engine-box {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.1), rgba(255, 0, 255, 0.1));
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.2), inset 0 0 20px rgba(255, 0, 255, 0.05);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* TEXT */
        .engine-text {
            font-size: 1.1rem;
            margin-bottom: 30px;
            color: #e0e0ff;
            font-weight: 500;
            line-height: 1.6;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CHOICES */
        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice {
            display: block;
            padding: 16px 20px;
            width: 100%;
            border-radius: 12px;
            background: linear-gradient(135deg, #1a1a3e, #2a1a4e);
            color: #fff;
            border: 2px solid rgba(0, 240, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            font-size: 1rem;
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .choice::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .choice:hover {
            border-color: rgba(0, 240, 255, 0.8);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.1);
            transform: translateX(8px);
            background: linear-gradient(135deg, #2a2a5e, #3a2a6e);
        }

        .choice:hover::before {
            left: 100%;
        }

        .choice:active {
            transform: translateX(6px);
        }

        /* RESULT */
        .result {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.05), rgba(255, 0, 255, 0.05));
            border-radius: 16px;
            border: 2px solid rgba(0, 240, 255, 0.5);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
            animation: slideUp 0.5s ease-out;
            display: none;
        }

        .result.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-text {
            font-size: 1.05rem;
            line-height: 1.8;
            margin-bottom: 20px;
            color: #d0d0ff;
        }

        .result-button {
            display: inline-block;
            padding: 14px 32px;
            background: linear-gradient(135deg, #00f0ff, #00d4ff);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        .result-button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            background: linear-gradient(135deg, #00ffff, #00e0ff);
        }

        .result-button:active {
            transform: scale(1.03);
        }

        /* RESET BUTTON */
        .reset-button {
            margin-top: 25px;
            padding: 10px 20px;
            background: rgba(100, 100, 120, 0.5);
            color: #a0a0c0;
            border: 1px solid rgba(100, 100, 120, 0.7);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: none;
        }

        .reset-button.show {
            display: inline-block;
        }

        .reset-button:hover {
            background: rgba(100, 100, 120, 0.8);
            border-color: rgba(150, 150, 170, 0.9);
            color: #d0d0d0;
        }

        /* ACCESSIBILITY */
        @media (max-width: 600px) {
            #astro-engine {
                padding: 25px 15px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .engine-box {
                padding: 30px 20px;
            }

            .choice {
                padding: 14px 18px;
                font-size: 0.95rem;
            }
        }

        /* FOCUS STYLES FOR KEYBOARD NAVIGATION */
        .choice:focus,
        .result-button:focus,
        .reset-button:focus {
            outline: 2px solid #00f0ff;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div id="astro-engine">
        <div class="engine-container">
            <h1>✨ Astrology Discovery Engine</h1>
            <p class="subtitle">Personalized guidance based on your cosmic interests</p>

            <div class="engine-box">
                <div class="engine-text" id="engineText">What are you most curious about right now?</div>
                <div class="choices-container" id="choices"></div>
                <div class="result" id="resultBox">
                    <div class="result-text" id="resultText"></div>
                    <a class="result-button" id="resultLink" href="#" target="_blank" rel="noopener noreferrer">
                        Explore Now →
                    </a>
                </div>
                <button class="reset-button" id="resetButton" onclick="resetEngine()">← Start Over</button>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://adventuresinastrology.com";

        const contentMap = {
            self: {
                text: "Start with your Ascendant, chart ruler, and house placements to understand how you present to the world.",
                link: `${BASE_URL}/chart-ruler-and-ascendant-study`,
                label: "Understanding myself"
            },
            love: {
                text: "Explore synastry, Venus placements, and emotional compatibility to understand relationship dynamics.",
                link: `${BASE_URL}/love-and-astrology`,
                label: "Love + relationships"
            },
            learning: {
                text: "Build your foundation with signs, planets, aspects, and essential chart basics.",
                link: `${BASE_URL}/core-astrology`,
                label: "Learning astrology"
            },
            advanced: {
                text: "Dive into draconic charts, profections, solar return analysis, and deeper research techniques.",
                link: `${BASE_URL}/advanced-astrology-techniques`,
                label: "Advanced techniques"
            }
        };

        let state = {
            interest: null,
            level: null
        };

        function startEngine() {
            setState("", "");
            renderChoices([
                { key: "self", label: contentMap.self.label },
                { key: "love", label: contentMap.love.label },
                { key: "learning", label: contentMap.learning.label },
                { key: "advanced", label: contentMap.advanced.label }
            ], setInterest);
        }

        function renderChoices(options, callback) {
            const choicesHTML = options
                .map(opt => `
                    <button class="choice" onclick="handleChoice('${opt.key}', ${callback.name === 'setInterest' ? 'setInterest' : 'setLevel'})">
                        ${opt.label}
                    </button>
                `)
                .join("");
            document.getElementById("choices").innerHTML = choicesHTML;
            document.getElementById("resultBox").classList.remove("show");
        }

        function handleChoice(key, callbackName) {
            if (callbackName === "setInterest") {
                setInterest(key);
            } else {
                setLevel(key);
            }
        }

        function setInterest(val) {
            state.interest = val;
            setState("What's your experience level?", "show");

            renderChoices([
                { key: "beginner", label: "Beginner" },
                { key: "intermediate", label: "Intermediate" },
                { key: "advanced", label: "Advanced" }
            ]);

            // Attach level selection directly
            Array.from(document.querySelectorAll(".choice")).forEach((btn, i) => {
                const levels = ["beginner", "intermediate", "advanced"];
                btn.onclick = () => setLevel(levels[i]);
            });
        }

        function setLevel(val) {
            state.level = val;
            generateResult();
        }

        function generateResult() {
            const content = contentMap[state.interest];

            if (!content) {
                console.error("Invalid interest selected");
                return;
            }

            setState("Your personalized starting point:", "hide");

            document.getElementById("resultText").innerText = content.text;
            document.getElementById("resultLink").href = content.link;
            document.getElementById("resultLink").innerText = "Explore Now →";

            document.getElementById("choices").innerHTML = "";
            document.getElementById("resultBox").classList.add("show");
            document.getElementById("resetButton").classList.add("show");
        }

        function setState(text, resultDisplay) {
            document.getElementById("engineText").innerText = text;
        }

        function resetEngine() {
            state = { interest: null, level: null };
            document.getElementById("resetButton").classList.remove("show");
            startEngine();
        }

        // Initialize on load
        document.addEventListener("DOMContentLoaded", startEngine);
    </script>
</body>
</html>
